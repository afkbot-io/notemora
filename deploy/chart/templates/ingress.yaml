apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: review-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    stsSeconds: 31536000
    contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: review-login-limit
spec:
  rateLimit:
    average: 12
    period: 1m
    burst: 6
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-review-headers@kubernetescrd" .Release.Namespace }}
spec:
  ingressClassName: traefik
  tls:
    - secretName: {{ .Values.ingress.tlsSecret }}
      hosts: [{{ .Values.host }}]
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: {name: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: review-auth
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-review-headers@kubernetescrd,%s-review-login-limit@kubernetescrd" .Release.Namespace .Release.Namespace }}
spec:
  ingressClassName: traefik
  tls:
    - secretName: {{ .Values.ingress.tlsSecret }}
      hosts: [{{ .Values.host }}]
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          {{- range list "/api/auth/login" "/api/auth/activate" "/api/auth/exchange" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ $.Release.Name }}
                port: {name: http}
          {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: review-https
spec:
  redirectScheme: {scheme: https, permanent: true}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: review-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: '1'
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-review-https@kubernetescrd" .Release.Namespace }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: {name: http}
