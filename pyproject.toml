[project]
name = "notemora"
version = "0.1.0"
license = "MIT"
description = "Отдельный сервис визуальных обсуждений для людей и агентов"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "boto3>=1.36,<2",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
]

[project.scripts]
review-api = "review_platform.cli:serve"
review-admin = "review_platform.cli:main"
review-mcp = "review_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "pytest-cov>=6,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/review_platform", "packages/mcp/src/review_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
